# Render Blueprint. Create it with: New > Blueprint, then pick this repository.
services:
  - type: web
    name: matrix-number-system-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render sits behind one proxy. Without this every client shares one rate-limit bucket.
      - key: TRUST_PROXY
        value: "1"
      # Exact frontend origins, comma separated, for example https://app.example.com
      - key: CORS_ORIGIN
        sync: false
